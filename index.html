<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Scorekeep</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">Family scorekeeper</p><h1>Scorekeep</h1></div>
      <div class="theme-toggle" role="group" aria-label="Colour theme">
        <button class="theme-option" type="button" data-theme-choice="light">Light</button>
        <button class="theme-option" type="button" data-theme-choice="dark">Dark</button>
      </div>
    </header>
    <section id="setupView" class="card"><h2>New game</h2><div id="savedPeopleGroup" class="field-group hidden"><div class="field-label-row"><label>Saved people</label><span class="field-hint">Tap a name to add</span></div><div id="savedPeople" class="saved-people"></div></div><div class="field-group"><label>Players</label><div id="playersList" class="players-list"></div><div class="player-actions"><button id="addPlayerBtn" class="button button-secondary" type="button">+ Add player</button><button id="savePeopleBtn" class="button button-secondary" type="button">Save people</button></div></div><div class="field-row"><label>Start round<input id="roundStart" type="number" inputmode="numeric" min="0" max="99" value="3" /></label><label>End round<input id="roundEnd" type="number" inputmode="numeric" min="0" max="99" value="13" /></label></div><div class="field-group"><label>Winner<select id="winMode"><option value="low">Lowest score</option><option value="high">Highest score</option></select></label></div><button id="startGameBtn" class="button button-primary" type="button">Start game</button></section>
    <section id="gameView" class="hidden"><div class="round-heading"><div><p class="eyebrow">Current round</p><h2 id="roundTitle">Round 3</h2></div><div class="header-actions"><button id="gameSettingsBtn" class="text-button" type="button">Settings</button><button id="newGameBtn" class="text-button" type="button">New game</button></div></div><section id="gameSettings" class="card compact-card hidden"><div class="section-heading settings-heading"><h2>Game settings</h2><button id="closeSettingsBtn" class="text-button" type="button">Close</button></div><div class="field-row"><label>Start round<input id="gameRoundStart" type="number" inputmode="numeric" min="0" max="99" /></label><label>End round<input id="gameRoundEnd" type="number" inputmode="numeric" min="0" max="99" /></label></div><label class="settings-winner">Winner<select id="gameWinMode"><option value="low">Lowest score</option><option value="high">Highest score</option></select></label><p id="settingsHelp" class="settings-help"></p><button id="saveGameSettingsBtn" class="button button-secondary" type="button">Save settings</button></section><section class="card"><div id="scoreInputs" class="score-inputs"></div><button id="saveRoundBtn" class="button button-primary" type="button">Save round</button></section><section class="card standings-card"><div class="section-heading"><h2>Standings</h2><span id="modeLabel" class="pill"></span></div><div id="standings"></div></section><section id="historyCard" class="card hidden"><h2>Rounds</h2><div id="history"></div></section></section>
    <section id="winnerView" class="card winner-card hidden"><p class="eyebrow">Game over</p><h2 id="winnerTitle"></h2><p id="winnerScore" class="winner-score"></p><div id="finalStandings"></div><div class="winner-actions"><button id="playAgainBtn" class="button button-primary" type="button">Play again</button><button id="freshGameBtn" class="button button-secondary" type="button">New game</button></div></section>
  </main><script type="module" src="app.js"></script></body></html>
